# Default values for moe-sovereign.
# Profile defaults to "enterprise": no data-tier subcharts deployed, all
# connection strings expected from the user. See values-solo.yaml and
# values-team.yaml for the other two profiles.

profile: enterprise

image:
  registry: ghcr.io
  repository: moe-sovereign/orchestrator
  tag: ""                # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

mcp:
  image:
    repository: moe-sovereign/mcp-precision
    tag: ""
  replicas: 1
  port: 8003

admin:
  image:
    repository: moe-sovereign/admin-ui
    tag: ""
  replicas: 1
  port: 8088
  persistence:
    # Backs /app/data (knowledge-base uploads, etc.) and, when auth.oidc.enabled,
    # /app/.env (admin-ui's runtime config store — INFERENCE_SERVERS, EXPERT_MODELS).
    # Must be a real PVC: emptyDir silently loses both on every pod restart.
    size: 5Gi
    storageClass: ""

orchestrator:
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podAnnotations: {}
  extraEnv: []
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

serviceAccount:
  create: true
  name: ""
  annotations: {}

# OpenShift toggle — when true, we omit runAsUser/fsGroup so the SCC
# can inject its namespace-range UID, and we emit a Route instead of Ingress.
openshift:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  annotations: {}

ingress:
  enabled: true
  className: nginx
  host: moe.local
  tls:
    enabled: false
    secretName: moe-tls
  annotations: {}

adminIngress:
  enabled: false
  className: nginx
  host: admin.moe.local
  tls:
    enabled: false
    secretName: moe-admin-tls
  annotations: {}

portalIngress:
  enabled: false
  className: nginx
  host: portal.moe.local
  tls:
    enabled: false
    secretName: moe-portal-tls
  annotations: {}
  # port: override when portal service is known

route:
  enabled: false       # automatically flipped when .Values.openshift.enabled
  host: ""
  tls:
    termination: edge

networkPolicy:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1

# JWT / multi-tenancy config. The public key goes in a secret, not values.
auth:
  jwtIssuer: "https://admin.moe.local"
  jwtAudience: "moe-orchestrator"
  existingSecret: ""
  # key of the data entry inside the secret that holds the PEM public key
  publicKeyField: "jwt_public_key.pem"
  # Admin UI SSO login (separate from the orchestrator's JWT bearer-token
  # verification above). When enabled, the admin-ui container gets
  # AUTHENTIK_URL / OIDC_CLIENT_ID / PUBLIC_SSO_URL from the ConfigMap, and
  # OIDC_CLIENT_SECRET / AUTHENTIK_API_TOKEN from `oidc.secretName`
  # (a pre-existing Secret this chart does not create).
  oidc:
    enabled: false
    authentikUrl: ""
    clientId: "moe-infra"
    publicSsoUrl: ""
    secretName: "moe-sovereign-oidc"

publicUrls:
  appBaseUrl: ""
  adminUrl: ""
  apiUrl: ""

rateLimit:
  defaultRpm: 60
  defaultBurst: 10

# External connection strings — ignored when the matching subchart is enabled.
external:
  postgresUrl: ""       # postgres://user:pass@host:5432/moe
  kafkaUrl: ""          # host:9092
  valkeyUrl: ""         # redis://host:6379/0
  neo4jUri: ""          # bolt://host:7687
  chromaHost: ""        # http://host:8000

# Expert templates are mounted as a ConfigMap built from configs/experts/*.yaml
experts:
  mountPath: /app/configs/experts

observability:
  enabled: true
  loki:
    url: ""             # http://loki.observability.svc:3100/loki/api/v1/push
  tempo:
    url: ""             # http://tempo.observability.svc:4317
  alloy:
    image: grafana/alloy:latest

# ---------- Subchart toggles ----------
postgresql:
  enabled: false
  auth:
    username: moe
    database: moe
    existingSecret: moe-postgres

kafka:
  enabled: false
  controller:
    replicaCount: 1

valkey:
  enabled: false
  architecture: standalone

neo4j:
  enabled: false

# Referenced by orchestrator/mcp for NEO4J_PASS (key: NEO4J_PASSWORD) and by
# the neo4j subchart itself via neo4j.passwordFromSecret (key: NEO4J_AUTH,
# format "neo4j/<password>" — the neo4j chart's own contract). Not created
# by this chart; must exist before neo4j.enabled: true is synced.
neo4jAuth:
  existingSecret: "neo4j-credentials"

# Internes PostgreSQL für Admin-UI (moe_userdb)
moeUserdb:
  enabled: false
  image: postgres:16-alpine
  user: moe_admin
  database: moe_userdb
