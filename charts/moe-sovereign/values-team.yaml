# Team profile — full stack bundled via Bitnami subcharts.
# Single `helm install` gives a homelab / KMU-grade deployment.

profile: team

orchestrator:
  replicas: 2

postgresql:
  enabled: true
  primary:
    persistence:
      size: 20Gi

kafka:
  enabled: true
  controller:
    replicaCount: 3
    persistence:
      size: 20Gi

valkey:
  enabled: true
  architecture: replication

neo4j:
  enabled: true
  neo4j:
    name: "neo4j"
    # password left unset: the neo4j chart auto-generates one on first
    # install (see charts/neo4j/values.yaml). Set neo4jAuth.existingSecret
    # and neo4j.neo4j.passwordFromSecret to pin credentials instead.
  volumes:
    data:
      mode: "defaultStorageClass"
      defaultStorageClass:
        requests:
          storage: 8Gi
