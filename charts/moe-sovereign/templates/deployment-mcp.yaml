apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moe.fullname" . }}-mcp
  labels:
    {{- include "moe.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "moe.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "moe.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: {{ include "moe.serviceAccountName" . }}
      {{- if ne (include "moe.isOpenShift" .) "true" }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          image: {{ include "moe.image.mcp" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
          envFrom:
            - configMapRef:
                name: {{ include "moe.fullname" . }}-env
          {{- if .Values.neo4j.enabled }}
          env:
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.neo4jAuth.existingSecret }}
                  key: NEO4J_PASSWORD
          {{- end }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: generated
              mountPath: /app/generated
      volumes:
        - name: tmp
          emptyDir: {}
        - name: generated
          emptyDir: {}
