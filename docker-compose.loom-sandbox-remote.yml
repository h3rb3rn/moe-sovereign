      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /build:exec,nosuid,size=1024m,uid=1003,gid=0,mode=1770
    network_mode: bridge
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128

  rust-loom-sandbox-3:
    image: moe-infra-rust-loom-sandbox:latest
    container_name: rust-loom-sandbox-3
    restart: always
    ports:
      - "127.0.0.1:8083:8080"
