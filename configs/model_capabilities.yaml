# configs/model_capabilities.yaml — Per-model capability matrix (TASK-31).
#
# Missing models fall back to "default" — no KeyError.
# Hot-reload: set CAPABILITIES_RELOAD_ON_REQUEST=true (dev only, avoids rebuild).
#
# Fields:
#   json_schema  — honours response_format={"type":"json_schema",...}
#   json_object  — honours response_format={"type":"json_object"}
#   stream       — supports streaming (stream=true)

default:
  json_schema: false
  json_object: true
  stream: true

models:
  "qwen3:32b":
    json_schema: true
    json_object: true
    stream: true

  "qwen3.6:35b":
    json_schema: true
    json_object: true
    stream: true

  "qwen2.5:32b":
    json_schema: true
    json_object: true
    stream: true

  "qwen2.5:72b":
    json_schema: true
    json_object: true
    stream: true

  "llama3.3-70b-ctx4k:latest":
    json_schema: false
    json_object: false
    stream: true

  "llama3.3:70b":
    json_schema: false
    json_object: true
    stream: true

  "llama3:70b":
    json_schema: false
    json_object: true
    stream: true

  "mistral:7b":
    json_schema: true
    json_object: true
    stream: false

  "mistral-nemo:12b":
    json_schema: true
    json_object: true
    stream: true

  "phi4:14b":
    json_schema: true
    json_object: true
    stream: true

  "deepseek-r1:32b":
    json_schema: false
    json_object: true
    stream: true

  "gemma3:27b":
    json_schema: false
    json_object: true
    stream: true

  # Planner model: qwen3-based GGUF (q4km). Ollama's format:json suppresses
  # its <think> reasoning and causes it to emit empty `{}` or `[]` responses.
  # Removing the format constraint lets it use free-text generation, where it
  # reliably produces the correct JSON array via prompt guidance alone.
  "qwen3-planner:q4km":
    json_schema: false
    json_object: false
    stream: true
